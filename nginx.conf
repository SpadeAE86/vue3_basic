server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 视频分析：大文件上传 + 长耗时处理（默认 1m / 60s 会导致截断或 413，前端 parse JSON 报 Unexpected end of JSON input）
  client_max_body_size 512m;

  # Runtime config: do NOT cache
  location = /config.js {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  # Static assets
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Backend reverse proxy (same-origin)
  # /api 和 /api/ 分开写，避免被 SPA fallback 吃掉
  location = /api {
    add_header X-API-Proxy "nginx" always;
    add_header Cache-Control "no-store" always;
    rewrite ^/api$ / break;
    proxy_pass http://${BACKEND_UPSTREAM};
    proxy_http_version 1.1;
    # 避免后端在 ELB/Ingress 上按 Host 分流时，又把请求路由回前端
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
  }

  location ^~ /api/ {
    add_header X-API-Proxy "nginx" always;
    add_header Cache-Control "no-store" always;
    rewrite ^/api/?(.*)$ /$1 break;
    proxy_pass http://${BACKEND_UPSTREAM};
    proxy_http_version 1.1;
    # 避免后端在 ELB/Ingress 上按 Host 分流时，又把请求路由回前端
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
  }
}

